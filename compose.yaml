services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shopos
      POSTGRES_USER: shopos
      POSTGRES_PASSWORD: shopos_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shopos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopos -d shopos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shopos_pgdata:
