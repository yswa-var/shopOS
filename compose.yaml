services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shopos
      POSTGRES_USER: shopos
      POSTGRES_PASSWORD: shopos_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shopos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopos -d shopos"]
      interval: 5s
      timeout: 3s
      retries: 10
  storage:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - shopos_objects:/data
      - ./.local/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  shopos_pgdata:
  shopos_objects:
