[project]
name = "shopos"
version = "0.1.0"
description = "Telegram bill ingestion bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0,<4.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.1",
]

[project.scripts]
shopos = "shopos.main:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.workspace]
members = [
    "app_server",
]
