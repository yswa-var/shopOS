name: Check
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shopos
          POSTGRES_USER: shopos
          POSTGRES_PASSWORD: shopos_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopos -d shopos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://shopos:shopos_ci_only@localhost:5432/shopos
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra test --locked
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
        working-directory: android
