databases:
  - name: shopos-db
    plan: 0.1c-256mb
    databaseName: shopos
    user: shopos
    ipAllowList: []

services:
  - type: web
    name: shopos-api
    runtime: python
    plan: 0.5c-512mb
    buildCommand: uv sync --locked --no-dev
    preDeployCommand: uv run --no-sync alembic upgrade head
    startCommand: uv run --no-sync uvicorn shopos.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopos-db
          property: connectionString
      - key: R2_BUCKET
        sync: false
      - key: R2_REGION
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
