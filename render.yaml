databases:
  - name: shopos-db
    plan: 0.1c-256mb
    databaseName: shopos
    user: shopos
    ipAllowList: []

services:
  - type: web
    name: shopos-api
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install .
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn shopos.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopos-db
          property: connectionString
